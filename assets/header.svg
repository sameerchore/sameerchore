<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Sameer Chore, software development and AI/ML">
  <defs>
    <radialGradient id="glow" cx="12%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#9953EA" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#9953EA" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9953EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9953EA" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#9953EA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9953EA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9953EA" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#9953EA" stop-opacity="0.06"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .name { font-size: 48px; font-weight: 700; letter-spacing: 4px; fill: #9953EA; }
      .role { font-size: 19px; font-weight: 500; letter-spacing: 1.5px; fill: #9953EA; fill-opacity: 0.72; }
      .tick { font-size: 11px; letter-spacing: 2px; fill: #9953EA; fill-opacity: 0.30; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="248" rx="14" fill="none" stroke="url(#frame)" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="248" rx="14" fill="url(#glow)"/>

  <g>
    <rect x="48" y="46" width="4" height="26" fill="#9953EA" fill-opacity="0.9">
      <animate attributeName="fill-opacity" values="0.9;0.25;0.9" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text class="mono tick" x="66" y="65">GITHUB.COM/SAMEERCHORE</text>
  </g>

  <!-- pixel snowfall motif, echoing the winter pixel-art avatar -->
  <g transform="translate(760,40)">
    <rect x="0"   y="4"  width="10" height="10" fill="#9953EA" fill-opacity="0.18"/>
    <rect x="34"  y="18" width="10" height="10" fill="#9953EA" fill-opacity="0.30"/>
    <rect x="68"  y="0"  width="10" height="10" fill="#9953EA" fill-opacity="0.22"/>
    <rect x="14"  y="34" width="10" height="10" fill="#9953EA" fill-opacity="0.45"/>
    <rect x="50"  y="42" width="10" height="10" fill="#9953EA" fill-opacity="0.60"/>
    <rect x="86"  y="30" width="10" height="10" fill="#9953EA" fill-opacity="0.35"/>
    <rect x="30"  y="60" width="10" height="10" fill="#9953EA" fill-opacity="0.80"/>
    <rect x="64"  y="66" width="10" height="10" fill="#F2EBFA" fill-opacity="0.9">
      <animate attributeName="fill-opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="4"   y="80" width="10" height="10" fill="#9953EA" fill-opacity="0.50"/>
  </g>

  <text class="mono name" x="46" y="140">SAMEER CHORE</text>

  <rect x="48" y="162" width="904" height="1.5" fill="url(#rule)"/>

  <text class="mono role" x="48" y="202">software development and AI/ML</text>
</svg>
