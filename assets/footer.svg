<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="1000" height="90" role="img" aria-label="Break things. Build better.">
  <defs>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B77DFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#B77DFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B77DFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B77DFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .f { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
           font-size: 19px; font-weight: 700; letter-spacing: 4px; fill: #B77DFF; }
    </style>
  </defs>

  <rect x="60" y="44" width="185" height="1.5" fill="url(#fl)"/>
  <rect x="755" y="44" width="185" height="1.5" fill="url(#fr)"/>

  <rect x="263" y="38" width="8" height="8" rx="1.5" transform="rotate(45 267 42)" fill="#B77DFF" fill-opacity="0.45"/>
  <rect x="729" y="38" width="8" height="8" rx="1.5" transform="rotate(45 733 42)" fill="#B77DFF" fill-opacity="0.45"/>

  <text class="f" x="500" y="53" text-anchor="middle">
    BREAK THINGS. BUILD BETTER.
    <animate attributeName="fill-opacity" values="1;0.45;1" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
